name: Build Redmi AX6000 110M Firmware

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the selected firmware files as a GitHub Release
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 17 * * 0"

concurrency:
  group: ax6000-110m-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x.git
  REPO_BRANCH: openwrt-21.02
  SOURCE_COMMIT: ba554197ed7e252fd3c1ee023621e1d1d009d323
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ax6000.config
  DIY_SH: diy.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install $(cat "$GITHUB_WORKSPACE/depends-ubuntu")
          sudo timedatectl set-timezone "$TZ"

      - name: Checkout pinned ImmortalWrt source
        run: |
          git clone --filter=blob:none --single-branch --branch "$REPO_BRANCH" \
            "$REPO_URL" "$GITHUB_WORKSPACE/iwrt"
          git -C "$GITHUB_WORKSPACE/iwrt" checkout --detach "$SOURCE_COMMIT"
          test "$(git -C "$GITHUB_WORKSPACE/iwrt" rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C "$GITHUB_WORKSPACE/iwrt" merge-base --is-ancestor \
            "$SOURCE_COMMIT" "origin/$REPO_BRANCH"

      - name: Prepare feeds and configuration
        working-directory: iwrt
        run: |
          cp "$GITHUB_WORKSPACE/$FEEDS_CONF" feeds.conf.default
          ./scripts/feeds update -a
          bash "$GITHUB_WORKSPACE/$DIY_SH"
          ./scripts/feeds install -a
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          make defconfig
          test "$(grep -c '^CONFIG_TARGET_mediatek_mt7986_DEVICE_.*=y$' .config)" -eq 1
          grep -qx 'CONFIG_TARGET_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000=y' .config
          grep -qx '# CONFIG_TARGET_mediatek_mt7986_DEVICE_xiaomi_redmi-router-ax6000-stock is not set' .config
          grep -q '^CONFIG_PACKAGE_kmod-mediatek_hnat=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-warp=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y$' .config
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-passwall|xray-core|v2ray-geoip|v2ray-geosite|hysteria|haproxy|luci-app-frpc|luci-app-frps|frpc|frps|luci-app-ddns-go|ddns-go|luci-app-serverchan|luci-app-smartdns|smartdns|luci-app-vlmcsd|vlmcsd|luci-app-ttyd|ttyd)=y$' .config; then
            echo "A forbidden optional service was selected" >&2
            exit 1
          fi

      - name: Download sources
        working-directory: iwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: iwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware files
        id: firmware
        working-directory: iwrt
        run: |
          target_dir="$PWD/bin/targets/mediatek/mt7986"
          output_dir="$GITHUB_WORKSPACE/firmware"
          test -d "$target_dir"
          mkdir -p "$output_dir"

          find "$target_dir" -maxdepth 1 -type f \
            \( -name '*xiaomi_redmi-router-ax6000*sysupgrade*.bin' \
            -o -name '*xiaomi_redmi-router-ax6000*factory*.bin' \
            -o -name 'config.buildinfo' \
            -o -name '*.manifest' \) \
            ! -name '*stock*' \
            -exec cp '{}' "$output_dir/" \;

          compgen -G "$output_dir/*xiaomi_redmi-router-ax6000*sysupgrade*.bin" >/dev/null
          if test -f "$target_dir/sha256sums"; then
            while read -r checksum filename; do
              filename="${filename#\*}"
              if test -f "$output_dir/$filename"; then
                printf '%s  %s\n' "$checksum" "$filename"
              fi
            done < "$target_dir/sha256sums" > "$output_dir/sha256sums"
            test -s "$output_dir/sha256sums"
          fi
          short_source="${SOURCE_COMMIT:0:12}"
          echo "artifact_name=redmi-ax6000-immortalwrt-110m-$short_source" >> "$GITHUB_OUTPUT"
          echo "release_tag=ax6000-110m-$short_source-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          ls -lh "$output_dir"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.firmware.outputs.artifact_name }}
          path: firmware/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.firmware.outputs.release_tag }}" firmware/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Redmi AX6000 ImmortalWrt 110M ${{ steps.firmware.outputs.release_tag }}" \
            --notes "hanwckf immortalwrt-mt798x openwrt-21.02, non-stock 110 MiB single-UBI layout. Source: $SOURCE_COMMIT"
